version: 0.2

phases:
  install:
    commands:
      - echo Installing Node.js...
      - curl -sL https://rpm.nodesource.com/setup_16.x | bash -
      - yum install -y nodejs
  pre_build:
    commands:
      - echo Preparing environment...
      - npm install
  build:
    commands:
      - echo Building the application...
      - npm run build
  post_build:
    commands:
      - echo Build completed successfully!

artifacts:
  files:
    - '**/*'
  discard-paths: no
  base-directory: build
