version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 16 # Specify Node.js version or any required runtime
    commands:
      - echo Installing dependencies...

  pre_build:
    commands:
      - echo Preparing environment...
      - npm install # Example command to install dependencies

  build:
    commands:
      - echo Building the application...
      - npm run build # Replace with your build command

  post_build:
    commands:
      - echo Build completed successfully!

artifacts:
  files:
    - '**/*' # Include all files
  discard-paths: no # Maintain folder structure
  base-directory: build # Specify the directory containing build output
